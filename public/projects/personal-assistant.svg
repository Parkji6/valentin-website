<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="paBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2e1065;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#paBg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Terminal window -->
  <rect x="200" y="180" width="600" height="540" rx="12" fill="#0f0f23" stroke="#312e81" stroke-width="1"/>
  <rect x="200" y="180" width="600" height="40" rx="12" fill="#1e1b4b"/>
  <circle cx="225" cy="200" r="6" fill="#ef4444"/>
  <circle cx="247" cy="200" r="6" fill="#eab308"/>
  <circle cx="269" cy="200" r="6" fill="#22c55e"/>
  <text x="500" y="206" font-family="Monaco, monospace" font-size="13" text-anchor="middle" fill="#94a3b8">~/personal-assistant</text>

  <!-- Terminal content -->
  <text x="220" y="260" font-family="Monaco, monospace" font-size="14" fill="#10b981">$ assistant start</text>
  <text x="220" y="290" font-family="Monaco, monospace" font-size="14" fill="#94a3b8">→ Loading local model...</text>
  <text x="220" y="320" font-family="Monaco, monospace" font-size="14" fill="#94a3b8">→ No network calls. ✓</text>
  <text x="220" y="350" font-family="Monaco, monospace" font-size="14" fill="#94a3b8">→ Encrypted SQLite store. ✓</text>
  <text x="220" y="380" font-family="Monaco, monospace" font-size="14" fill="#a78bfa">Ready.</text>

  <text x="220" y="430" font-family="Monaco, monospace" font-size="14" fill="#10b981">$ remind me to call mom at 5pm</text>
  <text x="220" y="460" font-family="Monaco, monospace" font-size="14" fill="#94a3b8">✓ Reminder saved (encrypted)</text>

  <text x="220" y="510" font-family="Monaco, monospace" font-size="14" fill="#10b981">$ summarize today</text>
  <text x="220" y="540" font-family="Monaco, monospace" font-size="14" fill="#fbbf24">3 tasks done</text>
  <text x="220" y="565" font-family="Monaco, monospace" font-size="14" fill="#fbbf24">2 meetings</text>
  <text x="220" y="590" font-family="Monaco, monospace" font-size="14" fill="#fbbf24">1 reminder pending</text>

  <text x="220" y="640" font-family="Monaco, monospace" font-size="14" fill="#10b981">$ _</text>
  <rect x="240" y="630" width="10" height="16" fill="#10b981" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Right side: Privacy lock visualization -->
  <g transform="translate(900, 220)">
    <!-- Shield -->
    <path d="M 250 0 L 480 80 L 480 280 Q 480 380 250 480 Q 20 380 20 280 L 20 80 Z"
          fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.5"/>

    <path d="M 250 30 L 450 100 L 450 280 Q 450 360 250 440 Q 50 360 50 280 L 50 100 Z"
          fill="#312e81" opacity="0.3"/>

    <!-- Lock -->
    <rect x="170" y="200" width="160" height="140" rx="12" fill="#a78bfa"/>
    <path d="M 200 200 Q 200 130 250 130 Q 300 130 300 200" fill="none" stroke="#a78bfa" stroke-width="14"/>
    <circle cx="250" cy="265" r="14" fill="#1e1b4b"/>
    <rect x="246" y="270" width="8" height="30" fill="#1e1b4b"/>

    <!-- Floating data badges -->
    <g opacity="0.85">
      <rect x="-30" y="100" width="120" height="30" rx="15" fill="#10b981"/>
      <text x="30" y="120" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">LOCAL</text>

      <rect x="380" y="80" width="160" height="30" rx="15" fill="#f59e0b"/>
      <text x="460" y="100" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">END-TO-END</text>

      <rect x="-50" y="400" width="160" height="30" rx="15" fill="#ec4899"/>
      <text x="30" y="420" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">NO TELEMETRY</text>

      <rect x="370" y="420" width="170" height="30" rx="15" fill="#06b6d4"/>
      <text x="455" y="440" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">OPEN SOURCE</text>
    </g>
  </g>
</svg>

<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="polishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#polishGrad)"/>

  <!-- Card frame -->
  <rect x="150" y="120" width="350" height="390" fill="white" rx="12" opacity="0.95"/>

  <!-- Language circles -->
  <circle cx="850" cy="200" r="80" fill="white" opacity="0.2"/>
  <circle cx="950" cy="280" r="60" fill="white" opacity="0.15"/>

  <!-- Card content -->
  <text x="325" y="200" font-size="48" font-weight="bold" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif">Cześć</text>
  <text x="325" y="250" font-size="28" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif">Hello</text>

  <!-- Learning progress bars -->
  <rect x="180" y="290" width="290" height="8" fill="#e2e8f0" rx="4"/>
  <rect x="180" y="290" width="232" height="8" fill="#3b82f6" rx="4"/>
  <text x="180" y="330" font-size="14" fill="#64748b" font-family="Arial, sans-serif">70% Fluent</text>

  <!-- Features list -->
  <circle cx="200" cy="380" r="4" fill="#06b6d4"/>
  <text x="220" y="385" font-size="13" fill="#475569" font-family="Arial, sans-serif">AI-powered lessons</text>

  <circle cx="200" cy="420" r="4" fill="#06b6d4"/>
  <text x="220" y="425" font-size="13" fill="#475569" font-family="Arial, sans-serif">Real-time feedback</text>

  <!-- Main title -->
  <text x="600" y="500" font-size="56" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Polish App</text>
  <text x="600" y="560" font-size="24" text-anchor="middle" fill="white" opacity="0.9" font-family="Arial, sans-serif">Master Polish with AI</text>
</svg>
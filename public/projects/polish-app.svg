<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="polishBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#polishBg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#0ea5e9" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Phone mockup -->
  <rect x="600" y="120" width="400" height="660" rx="40" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="620" y="160" width="360" height="580" rx="20" fill="#f8fafc"/>

  <!-- Phone notch -->
  <rect x="750" y="135" width="100" height="14" rx="7" fill="#0f172a"/>

  <!-- App content -->
  <text x="800" y="220" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Polish App</text>

  <!-- Flag indicator -->
  <rect x="660" y="240" width="280" height="50" rx="8" fill="#dc2626"/>
  <rect x="660" y="240" width="280" height="25" rx="8" fill="#fff"/>
  <text x="800" y="275" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0c4a6e">🇵🇱  Lesson 12 — A2</text>

  <!-- Word card -->
  <rect x="660" y="320" width="280" height="120" rx="12" fill="#0ea5e9"/>
  <text x="800" y="365" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="white">Cześć</text>
  <text x="800" y="395" font-family="Arial" font-size="16" text-anchor="middle" fill="#e0f2fe">/ʧɛɕt͡ɕ/</text>
  <text x="800" y="420" font-family="Arial" font-size="14" text-anchor="middle" fill="#bae6fd">Hello (informal)</text>

  <!-- Progress -->
  <rect x="660" y="470" width="280" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="660" y="470" width="200" height="6" rx="3" fill="#10b981"/>
  <text x="660" y="500" font-family="Arial" font-size="12" fill="#64748b">Lesson progress</text>
  <text x="940" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="end" fill="#10b981">71%</text>

  <!-- Buttons -->
  <rect x="660" y="530" width="130" height="48" rx="24" fill="#f1f5f9"/>
  <text x="725" y="560" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">Skip</text>

  <rect x="810" y="530" width="130" height="48" rx="24" fill="#0ea5e9"/>
  <text x="875" y="560" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Got it</text>

  <!-- Stats -->
  <rect x="660" y="600" width="85" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="702" y="635" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0c4a6e">847</text>
  <text x="702" y="660" font-family="Arial" font-size="11" text-anchor="middle" fill="#64748b">Words</text>

  <rect x="755" y="600" width="85" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="797" y="635" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0c4a6e">23</text>
  <text x="797" y="660" font-family="Arial" font-size="11" text-anchor="middle" fill="#64748b">Day streak</text>

  <rect x="850" y="600" width="85" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="892" y="635" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0c4a6e">A2</text>
  <text x="892" y="660" font-family="Arial" font-size="11" text-anchor="middle" fill="#64748b">Level</text>

  <!-- Floating language tags around -->
  <g opacity="0.6">
    <rect x="120" y="200" width="200" height="60" rx="30" fill="#0ea5e9"/>
    <text x="220" y="238" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="white">Dzień dobry</text>

    <rect x="180" y="320" width="160" height="50" rx="25" fill="#f59e0b"/>
    <text x="260" y="352" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Dziękuję</text>

    <rect x="100" y="450" width="180" height="55" rx="27" fill="#ec4899"/>
    <text x="190" y="485" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Przepraszam</text>

    <rect x="150" y="580" width="140" height="50" rx="25" fill="#10b981"/>
    <text x="220" y="612" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Tak / Nie</text>

    <rect x="1280" y="220" width="160" height="55" rx="27" fill="#8b5cf6"/>
    <text x="1360" y="255" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Smacznego</text>

    <rect x="1320" y="350" width="170" height="50" rx="25" fill="#06b6d4"/>
    <text x="1405" y="382" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Do widzenia</text>

    <rect x="1290" y="470" width="150" height="55" rx="27" fill="#f43f5e"/>
    <text x="1365" y="505" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Proszę</text>

    <rect x="1310" y="600" width="170" height="50" rx="25" fill="#84cc16"/>
    <text x="1395" y="632" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Witam Cię</text>
  </g>
</svg>

<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>
  </g>

  <!-- Code window -->
  <rect x="180" y="180" width="600" height="540" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="180" y="180" width="600" height="40" rx="12" fill="#0f172a"/>
  <circle cx="210" cy="200" r="6" fill="#ef4444"/>
  <circle cx="232" cy="200" r="6" fill="#eab308"/>
  <circle cx="254" cy="200" r="6" fill="#22c55e"/>

  <!-- Code lines -->
  <text x="210" y="260" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">import</text>
  <text x="285" y="260" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">Anthropic</text>
  <text x="395" y="260" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">from</text>
  <text x="445" y="260" font-family="Monaco, monospace" font-size="16" fill="#fbbf24">"@anthropic"</text>

  <text x="210" y="310" font-family="Monaco, monospace" font-size="16" fill="#94a3b8">// Build AI products</text>

  <text x="210" y="360" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">const</text>
  <text x="270" y="360" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">client =</text>
  <text x="370" y="360" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">new</text>
  <text x="410" y="360" font-family="Monaco, monospace" font-size="16" fill="#60a5fa">Anthropic</text>
  <text x="500" y="360" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">();</text>

  <text x="210" y="410" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">const</text>
  <text x="270" y="410" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">response =</text>
  <text x="385" y="410" font-family="Monaco, monospace" font-size="16" fill="#a78bfa">await</text>
  <text x="440" y="410" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">claude</text>

  <text x="240" y="450" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">.messages</text>
  <text x="240" y="490" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">.create({</text>
  <text x="270" y="530" font-family="Monaco, monospace" font-size="16" fill="#22c55e">model:</text>
  <text x="340" y="530" font-family="Monaco, monospace" font-size="16" fill="#fbbf24">"claude-4"</text>
  <text x="270" y="570" font-family="Monaco, monospace" font-size="16" fill="#22c55e">messages: [...]</text>
  <text x="240" y="610" font-family="Monaco, monospace" font-size="16" fill="#e2e8f0">});</text>

  <text x="210" y="660" font-family="Monaco, monospace" font-size="16" fill="#22c55e">// → Shipped 🚀</text>

  <!-- Right side: Neural network -->
  <g transform="translate(950, 200)">
    <!-- Layer 1 -->
    <circle cx="0" cy="100" r="20" fill="#f97316" opacity="0.9"/>
    <circle cx="0" cy="200" r="20" fill="#f97316" opacity="0.9"/>
    <circle cx="0" cy="300" r="20" fill="#f97316" opacity="0.9"/>
    <circle cx="0" cy="400" r="20" fill="#f97316" opacity="0.9"/>

    <!-- Layer 2 -->
    <circle cx="200" cy="50" r="20" fill="#ec4899" opacity="0.9"/>
    <circle cx="200" cy="150" r="20" fill="#ec4899" opacity="0.9"/>
    <circle cx="200" cy="250" r="20" fill="#ec4899" opacity="0.9"/>
    <circle cx="200" cy="350" r="20" fill="#ec4899" opacity="0.9"/>
    <circle cx="200" cy="450" r="20" fill="#ec4899" opacity="0.9"/>

    <!-- Layer 3 -->
    <circle cx="400" cy="150" r="20" fill="#a855f7" opacity="0.9"/>
    <circle cx="400" cy="250" r="20" fill="#a855f7" opacity="0.9"/>
    <circle cx="400" cy="350" r="20" fill="#a855f7" opacity="0.9"/>

    <!-- Connections -->
    <g stroke="#475569" stroke-width="1" opacity="0.4">
      <line x1="20" y1="100" x2="180" y2="50"/>
      <line x1="20" y1="100" x2="180" y2="150"/>
      <line x1="20" y1="100" x2="180" y2="250"/>
      <line x1="20" y1="200" x2="180" y2="50"/>
      <line x1="20" y1="200" x2="180" y2="150"/>
      <line x1="20" y1="200" x2="180" y2="250"/>
      <line x1="20" y1="200" x2="180" y2="350"/>
      <line x1="20" y1="300" x2="180" y2="150"/>
      <line x1="20" y1="300" x2="180" y2="250"/>
      <line x1="20" y1="300" x2="180" y2="350"/>
      <line x1="20" y1="300" x2="180" y2="450"/>
      <line x1="20" y1="400" x2="180" y2="250"/>
      <line x1="20" y1="400" x2="180" y2="350"/>
      <line x1="20" y1="400" x2="180" y2="450"/>

      <line x1="220" y1="50" x2="380" y2="150"/>
      <line x1="220" y1="150" x2="380" y2="150"/>
      <line x1="220" y1="150" x2="380" y2="250"/>
      <line x1="220" y1="250" x2="380" y2="150"/>
      <line x1="220" y1="250" x2="380" y2="250"/>
      <line x1="220" y1="250" x2="380" y2="350"/>
      <line x1="220" y1="350" x2="380" y2="250"/>
      <line x1="220" y1="350" x2="380" y2="350"/>
      <line x1="220" y1="450" x2="380" y2="350"/>
    </g>
  </g>
</svg>
